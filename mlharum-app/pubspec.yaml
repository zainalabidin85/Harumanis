name: ai_harum
description: Ai-Harumanis - AI-powered Harumanis Mango Management App
version: 1.9.0+16

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  camera: ^0.10.5
  url_launcher: ^6.2.5
  dio: ^5.4.3
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.2
  google_maps_flutter: ^2.5.3
  geolocator: ^11.0.0
  intl: any
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  qr_flutter: ^4.1.0
  package_info_plus: ^8.0.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A2E17"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
