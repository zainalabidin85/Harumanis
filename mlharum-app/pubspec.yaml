name: ai_harum
description: Ai-Harumanis - AI-powered Harumanis Mango Management App
version: 1.5.2+7

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5
  dio: ^5.4.3
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.2
  google_maps_flutter: ^2.5.3
  geolocator: ^11.0.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
